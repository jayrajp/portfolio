<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0B1120"/>

  <!-- Grid lines -->
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#232D45" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#232D45" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#232D45" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.3"/>
  <rect width="1200" height="630" fill="url(#fade)"/>

  <!-- Teal glow top-left -->
  <ellipse cx="200" cy="200" rx="300" ry="200" fill="#4FD1C5" opacity="0.04"/>

  <!-- Left accent bar -->
  <rect x="80" y="180" width="4" height="120" rx="2" fill="#4FD1C5"/>

  <!-- Eyebrow label -->
  <text x="100" y="210" font-family="monospace" font-size="18" fill="#4FD1C5" letter-spacing="3">// CUSTOM SOFTWARE ENGINEER</text>

  <!-- Main name -->
  <text x="96" y="300" font-family="Arial, sans-serif" font-weight="700" font-size="72" fill="#E8ECF4" letter-spacing="-1">Jayraj Mehta</text>

  <!-- Tagline -->
  <text x="100" y="360" font-family="Arial, sans-serif" font-size="28" fill="#8B96AC">CRMs · ERPs · SaaS Platforms · AI Systems · DevOps</text>

  <!-- Divider -->
  <line x1="100" y1="395" x2="700" y2="395" stroke="#232D45" stroke-width="1"/>

  <!-- Bottom stats -->
  <text x="100" y="440" font-family="monospace" font-size="20" fill="#4FD1C5">6+ yrs</text>
  <text x="100" y="465" font-family="Arial, sans-serif" font-size="14" fill="#5B6580">EXPERIENCE</text>

  <text x="240" y="440" font-family="monospace" font-size="20" fill="#4FD1C5">15+ clients</text>
  <text x="240" y="465" font-family="Arial, sans-serif" font-size="14" fill="#5B6580">SHIPPED</text>

  <text x="420" y="440" font-family="monospace" font-size="20" fill="#4FD1C5">End-to-end</text>
  <text x="420" y="465" font-family="Arial, sans-serif" font-size="14" fill="#5B6580">FULL OWNERSHIP</text>

  <!-- Right side card -->
  <rect x="820" y="160" width="300" height="310" rx="12" fill="#111A2E" stroke="#232D45" stroke-width="1"/>
  <text x="970" y="215" text-anchor="middle" font-family="monospace" font-size="12" fill="#F0B429" letter-spacing="2">FREE CALL</text>
  <text x="970" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#E8ECF4">Book a 20-min</text>
  <text x="970" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#E8ECF4">discovery call</text>
  <text x="970" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#8B96AC">No pitch. No obligation.</text>
  <text x="970" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#8B96AC">Just an honest conversation</text>
  <text x="970" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#8B96AC">about your problem.</text>

  <!-- CTA button -->
  <rect x="880" y="400" width="180" height="44" rx="8" fill="#4FD1C5"/>
  <text x="970" y="428" text-anchor="middle" font-family="monospace" font-weight="700" font-size="14" fill="#08151A">Get in touch →</text>

  <!-- Bottom URL -->
  <text x="100" y="560" font-family="monospace" font-size="16" fill="#5B6580">jayrajp.github.io/portfolio</text>
  <circle cx="1090" cy="555" r="6" fill="#4FD1C5" opacity="0.8"/>
  <text x="1100" y="560" font-family="Arial, sans-serif" font-size="14" fill="#4FD1C5">Available for work</text>
</svg>
